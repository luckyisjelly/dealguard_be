services:
  postgres:
    image: postgres:16
    container_name: dealguard-postgres
    environment:
      POSTGRES_DB: dealguard
      POSTGRES_USER: dealguard
      POSTGRES_PASSWORD: dealguard
    ports:
      - "5432:5432"
    volumes:
      - dealguard-postgres-data:/var/lib/postgresql/data

volumes:
  dealguard-postgres-data:
